# radiance_demo — a standalone demo site for the radiance theme.
#
# The content, data files and menus mirror Radiance/exampleSite, so every
# theme feature can be exercised: the handbook (content/docs, served
# under /docs/), posts (including a travel post), moodboards, the
# archive, tags, search and the appearance toggle.
#
# The theme lives in the neighbouring checkout (../Radiance) and is
# resolved through themesDir, so plain `hugo server` in this directory
# picks up theme edits immediately — no build flags required. The Pages
# workflow (.github/workflows/pages.yml) checks out the theme into
# themes/Radiance and overrides themesDir with HUGO_THEMESDIR instead:
# the --themesDir command-line flag is ignored when themesDir is also
# set in the config file; the environment variable is not.

baseURL = "https://cirrus365.github.io/radiance_demo/"
title = "radiance"
# The language key doubles as the document language (lang="en-gb").
defaultContentLanguage = "en-gb"
themesDir = ".."
theme = "Radiance"

[params]
  description = "A Hugo theme that makes a content website feel like an Ubuntu desktop running GNOME 2."

# Primary navigation for the top panel (layouts/partials/panel-top.html).
# A search link is rendered by the theme itself when a "search" page
# exists.

[[menus.main]]
  name = "Posts"
  pageRef = "/posts"
  weight = 10

[[menus.main]]
  name = "Moodboards"
  pageRef = "/moodboards"
  weight = 20

[[menus.main]]
  name = "Archive"
  pageRef = "/archive"
  weight = 30

[[menus.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 40

[[menus.main]]
  name = "Work with me"
  pageRef = "/work-with-me"
  weight = 50

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 60

[[menus.main]]
  name = "RSS"
  pageRef = "/"
  weight = 70
  [menus.main.params]
    feed = true

# Search index: a custom output format on the home page renders index.json.

[outputFormats]
  [outputFormats.search]
    mediaType = "application/json"

[outputs]
  home = ["HTML", "RSS", "search"]
